# Set OPD_PI05_STUDENT_CHECKPOINT to a checkpoint with SFT config/norm metadata.
# Set OPD_PI05_TEACHER_CHECKPOINT to the compatible teacher checkpoint.
# Method 4 (M4): Hybrid Flow-SDE rollout + Sampled Reverse-KL OPD, for the Flow-Based
# OPD Mechanism Study. Derived from
# maniskill_m3_hybrid_openpi_pi05.yaml (M3-Hybrid) -- same Hybrid-SDE rollout, only the
# loss changes (analytic KL -> sampled reverse-KL score-function objective). This isolates
# whether sampled OPD provides additional benefit beyond Hybrid-SDE coverage alone.
#
# Rollout: same Hybrid Flow-SDE as M3-Hybrid (noise_method: flow_sde; sample internal
# timestep k, ODE before k, one SDE transition at k, ODE after k).
#
# Loss (basic score-function objective; NO PPO clipping yet, per the plan):
#   A' ~ p_S^old(.|A_tau, o, tau)              [sample from student's old policy]
#   l_S_old = log p_S^old(A'|A_tau, o, tau)     [stored at sampling time]
#   l_T     = log p_T(A'|A_tau, o, tau)         [teacher log-prob at the same sample]
#   r_OPD   = stopgrad(l_T - l_S_old)
#   L_M4    = -log p_S^new(A'|A_tau, o, tau) * r_OPD
# PPO-style clipping (rho = exp(l_S_new - l_S_old) with clip_ratio_low/high) is an
# OPTIONAL follow-up only after the basic objective is validated -- do not enable it yet.
#
# STATUS: implemented. The three pieces, and where they come from:
#   (a) Hybrid-SDE rollout -- joint_logprob: False selects it; no new rollout code.
#   (b) l_S_old -- the rollout's prev_logprobs already IS the log-prob of the single
#       sampled transition under joint_logprob: False. l_S_new comes from the standard
#       default_forward path, which scores the same transition (get_log_prob_value sets
#       num_steps = 1 and reads denoise_inds[:, 0]).
#   (c) l_T -- fsdp_actor_worker._teacher_transition_logprobs builds mu_T from the teacher
#       velocity via the shared flow_sde coefficients and scores x_{k+1} under
#       N(mu_T, Sigma_k). It reuses the same teacher forward as M1/M3, so M4 costs no
#       extra teacher queries. Sigma_k is the student's, so both models share it.
# Required validation before trusting results (see plan): log/compare teacher log-prob,
# student old/new log-prob, OPD reward distribution, analytic KL at the same transition,
# sampled-vs-analytic KL estimate, gradient norms, stochastic-rollout success vs
# deterministic-ODE-eval success.
# Per the plan's experiment order, implement M4 only after M3 and M3-Hybrid are both
# validated and stable.
defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:OPD_RUN_DIR,./outputs}
    project_name: rlinf_pi_opd
    experiment_name: "maniskill_m4_openpi_pi05"
    logger_backends: ["tensorboard", "wandb"]
    # wandb_entity: null   # optional; default (null) uses your personal wandb entity/team

  max_epochs: 1000
  max_steps: 25   # training-rollout success_once is flat past step ~20-25 in the 50-step runs
                  # (final-10 window mean reached by then, later changes < the window sd),
                  # so the second half bought nothing. Halving the budget pays for per-step eval.
  only_eval: False
  val_check_interval: 1    # the whole gain happens in the first ~10 steps; 5 eval points could not resolve it
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False   # unused (no advantages/GAE per the plan)
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  # These three are LIVE for M4 (unlike M1/M3, where the loss bypasses the dispatcher) and
  # must keep r_OPD per-element. reward_type: chunk_level would flatten the advantages and
  # logprob_type: chunk_level would sum the log-probs over the chunk, collapsing the
  # per-element estimator into the summed one -- which is unbiased but strictly
  # higher-variance (the transition's components are independent under a diagonal Sigma).
  # These values mirror the reference OPD config, libero_10_opd_openvlaoft.yaml.
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1               # one sampled A' per rollout sample, matching M1/M3's single-draw convention

  # M4 IS the sampled reverse-KL objective: compute_opd_advantages gives
  # r_OPD = l_T - l_S_old and compute_opd_actor_loss gives L = -l_S_new * stopgrad(r_OPD),
  # which is exactly the score-function estimator of D_KL(p_S || p_T). Reusing "opd"
  # avoids a duplicate loss implementation. Only the teacher log-probability is
  # pi0.5-specific: the OpenVLA path scores action tokens, while here the teacher scores
  # the student's sampled flow transition (see _teacher_transition_logprobs).
  adv_type: opd
  loss_type: opd
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  # PPO clipping is deferred (plan: "Do Not Add PPO Initially"). clip_ratio_* kept here
  # only so the field exists once the optional PPO-clipped variant is enabled; unused by
  # the basic score-function loss.
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: False           # required so preprocess_embodied_batch builds loss_mask
    ignore_terminations: False  # mask steps after episode termination
    use_fixed_reset_state_ids: False
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    init_params:
      use_multiple_plates: False
  eval:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student
    precision: ${actor.model.precision}

  # Frozen teacher, queried for log p_T(A'|.) at the student-sampled transition.
  expert_model:
    model_path: ${oc.env:OPD_PI05_TEACHER_CHECKPOINT}  # RL-FlowSDE weights + SFT norm/config (composed via symlinks)
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 5120
  seed: 0
  enable_offload: True
  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student
    model_type: "openpi"
    add_value_head: False       # no critic / value head for this mechanism study
    num_action_chunks: 5
    num_steps: 4
    openpi:
      value_after_vlm: True
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      noise_method: "flow_sde"  # Hybrid SDE rollout, same as M3-Hybrid
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      # MUST be False, for two reasons: (1) it selects the Hybrid rollout (one sampled
      # SDE transition at k, flow_ode elsewhere) exactly as in M3-Hybrid; (2) it makes
      # the rollout's prev_logprobs the log-prob AT that single transition k
      # (openpi_action_model gathers log_probs[arange, denoise_inds[:, 0]]), which is
      # precisely l_S_old for the sampled reverse-KL objective. With True, prev_logprobs
      # is averaged over all denoise steps and is NOT the quantity this loss needs.
      joint_logprob: False
    policy_setup: widowx_bridge

  optim:
    lr: 5.0e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
