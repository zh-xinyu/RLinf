# Production-path draft: four GPUs, 20 physical rounds, 40 optimizer updates.
# Model/native-batch parity and real environment checks passed; full Ray/FSDP
# training still requires a smoke. Native text uses per-observation inference and
# storage representation that is compacted before every student/teacher forward.
# Set OPD_STUDENT_CHECKPOINT, OPD_LIBERO_{SPATIAL,OBJECT,GOAL,LONG}_TEACHER,
# OPD_RUN_DIR, and EMBODIED_PATH; paths always refer to local checkpoint folders.
# T16 differs from the standalone T4 probe; these curves are not a matched control.
# This draft also samples all official initial states; it does not yet reproduce
# the standalone train [0, 2] / held-out evaluation [1] split.
defaults:
  - env/libero_four_suite@env.train
  - env/libero_four_suite@env.eval
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: embodied
  max_epochs: 1000
  step_unit: optimizer_update
  max_steps: 40
  save_interval: 20
  val_check_interval: -1
  only_eval: false
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
  # Actual simulator calls, including settling/post-done work; session counters
  # restart on resume. Existing interaction/env_steps remains mask-based.
  log_physics_step_counts: true
  logger:
    log_path: ${oc.env:OPD_RUN_DIR}
    project_name: LIBERO_MOPD_Pilots
    experiment_name: libero_four_suite_refresh_r2_T16_B64_pilot
    logger_backends: [tensorboard]

algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  suite_balanced_sampling: true
  suite_batch_order: grouped
  log_suite_velocity_metrics: true
  # Same M3 local Gaussian objective as RoboCasa, with transported teacher
  # velocity and a shared covariance defined in the student's coordinates.
  loss_type: analytic_local_kl
  gr00t_cross_metadata_m3_mode: student_coordinate_sde
  adv_type: gae
  loss_agg_func: token-mean
  flow_refresh_updates: 2
  flow_reuse_mode: refresh
  flow_observation_sampling: full_pool
  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: EnvGroup
  train:
    seed: 1234
    reward_coef: ${algorithm.reward_coef}
  # Disabled during this short pilot. Independent per-task evaluation is required
  # before interpreting any training success metric as policy improvement.
  eval:
    seed: 1234
    is_eval: true
    task_sampling_strategy: ordered
    auto_reset: true
    use_ordered_reset_state_ids: true

actor:
  group_name: ActorGroup
  training_backend: fsdp
  global_batch_size: 64
  # Native prompts have different token lengths; compact one row at a time.
  micro_batch_size: 1
  seed: 1234
  enable_offload: true
  model:
    # RLobot-jun/gr00t-n1.5-libero-fewshot-combined-1k, downloaded and pinned.
    model_path: ${oc.env:OPD_STUDENT_CHECKPOINT}
    model_type: gr00t
    precision: bf16
    action_head_precision: fp32
    inference_autocast_dtype: bf16
    require_fp32_trainable_params: true
    action_dim: 7
    num_action_chunks: 8
    denoising_steps: 4
    add_value_head: false
    obs_converter_type: libero_grouped
    embodiment_tag: new_embodiment
    embodiment_projector_id: 31
    data_config_class: rlinf.models.embodiment.gr00t.gr00t_n1d5.modality_config:LiberoGroupedDataConfig
    opd_fixed_text_padding: false
    disable_image_tiling: true
    skip_backbone_logits: true
    rl_head_config:
      disable_dropout: true
      joint_logprob: true
      noise_method: flow_ode
      noise_level: 0.3
      add_value_head: false
      padding_value: 570
  optim:
    lr: 3.0e-5
    value_lr: 3.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0
    lr_scheduler: constant
    lr_warmup_steps: 4
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    wrap_policy:
      transformer_layer_cls_to_wrap:
        - Eagle2_5_VLForConditionalGeneration
        - FlowMatchingActionHeadForRLActionPrediction
        - TimestepEncoder
        - TimestepEmbedding
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
      cast_forward_inputs: true

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: bf16
    action_head_precision: fp32
    inference_autocast_dtype: bf16
    opd_fixed_text_padding: false
    disable_image_tiling: true
  expert_models:
    # Every override is explicit: teachers must not inherit the grouped student
    # state/action schema, embodiment tag, or native text-padding convention.
    libero_spatial:
      model_path: ${oc.env:OPD_LIBERO_SPATIAL_TEACHER}
      precision: bf16
      action_head_precision: bf16
      require_fp32_trainable_params: false
      obs_converter_type: libero
      embodiment_tag: libero_franka
      embodiment_projector_id: 31
      data_config_class: rlinf.models.embodiment.gr00t.gr00t_n1d5.modality_config:LiberoFrankaDataConfig
      opd_fixed_text_padding: true
      disable_image_tiling: true
    libero_object:
      model_path: ${oc.env:OPD_LIBERO_OBJECT_TEACHER}
      precision: bf16
      action_head_precision: bf16
      require_fp32_trainable_params: false
      obs_converter_type: libero
      embodiment_tag: libero_franka
      embodiment_projector_id: 31
      data_config_class: rlinf.models.embodiment.gr00t.gr00t_n1d5.modality_config:LiberoFrankaDataConfig
      opd_fixed_text_padding: true
      disable_image_tiling: true
    libero_goal:
      model_path: ${oc.env:OPD_LIBERO_GOAL_TEACHER}
      precision: bf16
      action_head_precision: bf16
      require_fp32_trainable_params: false
      obs_converter_type: libero
      embodiment_tag: libero_franka
      embodiment_projector_id: 31
      data_config_class: rlinf.models.embodiment.gr00t.gr00t_n1d5.modality_config:LiberoFrankaDataConfig
      opd_fixed_text_padding: true
      disable_image_tiling: true
    libero_10:
      model_path: ${oc.env:OPD_LIBERO_LONG_TEACHER}
      precision: bf16
      action_head_precision: bf16
      require_fp32_trainable_params: false
      obs_converter_type: libero
      embodiment_tag: libero_franka
      embodiment_projector_id: 31
      data_config_class: rlinf.models.embodiment.gr00t.gr00t_n1d5.modality_config:LiberoFrankaDataConfig
      opd_fixed_text_padding: true
      disable_image_tiling: true

reward:
  use_reward_model: false
critic:
  use_critic_model: false
