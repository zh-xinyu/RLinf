# Set OPD_PI05_STUDENT_CHECKPOINT to a checkpoint with SFT config/norm metadata.
# Set OPD_PI05_TEACHER_CHECKPOINT to the compatible teacher checkpoint.
# Method 1: On-Policy Velocity Distillation for pi0.5 on ManiSkill.
# Derived from maniskill_ppo_openpi_pi05.yaml. Student ODE rollout stores flow states
# (chains); a frozen teacher's velocity is distilled into the student via MSE:
#   L_vel = mean || v_S(A_t^tau, o_t, tau) - stop_grad(v_T(...)) ||_2^2
# No reward / advantage / critic / PPO.
# NOTE: this is the Flow-Based OPD Mechanism Study's M1 baseline. Rollout uses flow_ode (deterministic
#       ODE) rather than flow_noise: (a) matches the plan's M1 definition (ODE rollout), (b)
#       keeps M1 comparable to M3 (also ODE), isolating the M3-Hybrid/M4 Hybrid-SDE change as
#       the only rollout-mechanism difference in the study, and (c) flow_noise's ExploreNoiseNet
#       head is randomly initialized and never trained by the velocity_distill loss, so it adds
#       untrained noise rather than a principled exploration signal -- flow_ode avoids that
#       confound. The original opd-velocity-distill branch keeps its validated flow_noise config
#       unchanged as a separate, already-confirmed baseline.
defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:OPD_RUN_DIR,./outputs}
    project_name: rlinf_pi_opd
    experiment_name: "maniskill_veldistill_openpi_pi05"
    logger_backends: ["tensorboard", "wandb"]
    # wandb_entity: null   # optional; default (null) uses your personal wandb entity/team

  max_epochs: 1000
  max_steps: 25   # training-rollout success_once is flat past step ~20-25 in the 50-step runs
                  # (final-10 window mean reached by then, later changes < the window sd),
                  # so the second half bought nothing. Halving the budget pays for per-step eval.
                  # (step 25: success_at_end=0.741, step 50: 0.744, step 200: 0.753 -- diminishing
                  # returns past this point) and matches Method 2's comparison point (1.28M interactions).
  only_eval: False
  val_check_interval: 1    # the whole gain happens in the first ~10 steps; 5 eval points could not resolve it
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False   # unused (no advantages)
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level      # unused by velocity_distill, kept for consistency
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1               # supervised MSE; teacher velocities are cached

  adv_type: gae                 # placeholder; compute_advantages returns early for velocity_distill
  loss_type: velocity_distill   # -> compute_velocity_distill_loss (MSE on velocity)
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: False           # required so preprocess_embodied_batch builds loss_mask
    ignore_terminations: False  # mask steps after episode termination
    use_fixed_reset_state_ids: False
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    init_params:
      use_multiple_plates: False
  eval:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student
    precision: ${actor.model.precision}

  # Frozen teacher whose velocity field is distilled. DRY-RUN = student SFT (MSE ~= 0);
  # REAL = /egr/.../models/RLinf-Pi05-ManiSkill-25Main-RL-FlowSDE/actor
  expert_model:
    model_path: ${oc.env:OPD_PI05_TEACHER_CHECKPOINT}  # RL-FlowSDE weights + SFT norm/config (composed via symlinks)
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 5120
  seed: 0
  enable_offload: True
  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student
    model_type: "openpi"
    add_value_head: False       # no critic / value head for velocity distillation
    num_action_chunks: 5
    num_steps: 4
    openpi:
      value_after_vlm: True
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      noise_method: "flow_ode"
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
    policy_setup: widowx_bridge

  optim:
    lr: 5.0e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
