# Routed multi-teacher OPD (MOPD) for GR00T N1.5 on RoboCasa365.
#
# One student is distilled from three task-suite specialists. The supervision is Method 1
# (on-policy velocity distillation):
#   L = mean || v_S(A_t^tau, o_t, tau) - stop_grad(v_T^{k(task)}(...)) ||_2^2
# where k(task) routes each rollout sample to the teacher post-trained on its task suite.
# No reward / advantage / critic / PPO.
#
# The student runs the simulator; teachers are frozen and scored once per rollout, one
# teacher on the GPU at a time (the batch is partitioned by suite in the actor).
#
# split: target -- composite_unseen has no "pretrain" datasets (get_ds_soup returns 0
# tasks there), so "target" is the only split under which all three suites resolve.
defaults:
  - env/robocasa365@env.train
  - env/robocasa365@env.eval
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf_mopd_robocasa
    experiment_name: "robocasa365_mopd_gr00t"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 1000
  max_steps: 25
  only_eval: False
  val_check_interval: 5
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False   # unused (no advantages)
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level      # unused by velocity_distill, kept for consistency
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1               # supervised MSE; teacher velocities are cached

  adv_type: gae                 # placeholder; compute_advantages returns early here
  loss_type: velocity_distill   # -> compute_velocity_distill_loss (MSE on velocity)
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 64
    split: target
    task_soup: [atomic_seen, composite_seen, composite_unseen]
    task_mode: null             # keep both atomic and composite tasks
    task_filter:                # two shortest-horizon tasks per suite, so a routed
      - TurnOnMicrowave         # pilot fits in CPU-simulated wall clock
      - CloseToasterOvenDoor    # atomic_seen, 450 steps each
      - ScrubCuttingBoard       # composite_seen, 1200
      - RinseSinkBasin          # composite_seen, 1350
      - CuttingToolSelection    # composite_unseen, 1200
      - CategorizeCondiments    # composite_unseen, 1650
    task_sampling_strategy: random
    auto_reset: False           # required so preprocess_embodied_batch builds loss_mask
    ignore_terminations: False
    episode_horizon_source: max_episode_steps
    max_episode_steps: 300      # training only needs on-policy states, not completions
    max_steps_per_rollout_epoch: 300
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    init_params:
      camera_heights: 256       # the released checkpoints were trained at 256
      camera_widths: 256
    observation:
      state_layout:             # 16-d, in the order the GR00T checkpoints expect
        - base_pos
        - base_quat
        - base_to_eef_pos
        - base_to_eef_quat
        - gripper_qpos
  eval:
    rollout_epoch: 1
    total_num_envs: 48          # 6 tasks x 8 episodes, and divisible by the 8 workers
    split: target
    task_soup: [atomic_seen, composite_seen, composite_unseen]
    task_mode: null
    task_filter:                # two shortest-horizon tasks per suite, so a routed
      - TurnOnMicrowave         # pilot fits in CPU-simulated wall clock
      - CloseToasterOvenDoor    # atomic_seen, 450 steps each
      - ScrubCuttingBoard       # composite_seen, 1200
      - RinseSinkBasin          # composite_seen, 1350
      - CuttingToolSelection    # composite_unseen, 1200
      - CategorizeCondiments    # composite_unseen, 1650
    task_sampling_strategy: ordered
    auto_reset: True
    ignore_terminations: True
    episode_horizon_source: max_episode_steps
    max_episode_steps: 750      # covers both atomic tasks; composites cannot succeed
    max_steps_per_rollout_epoch: 750
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      camera_heights: 256
      camera_widths: 256
    observation:
      state_layout:
        - base_pos
        - base_quat
        - base_to_eef_pos
        - base_to_eef_quat
        - gripper_qpos

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/pretraining/checkpoint-80000"   # student init
    precision: ${actor.model.precision}

  # Routed teachers. Keys are RoboCasa task-suite (task_soup) labels; the rollout worker
  # turns each sample's suite into an index into this mapping and the actor groups the
  # teacher forward passes by it.
  expert_models:
    atomic_seen:
      model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/target_posttraining/atomic_seen/checkpoint-60000"
      precision: ${actor.model.precision}
    composite_seen:
      model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_seen/checkpoint-60000"
      precision: ${actor.model.precision}
    composite_unseen:
      model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_unseen/checkpoint-60000"
      precision: ${actor.model.precision}

  teacher_router:
    obs_key: task_groups        # per-sample observation field naming the task group

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 3840   # (300/5) * 64 = one update per rollout
  seed: 0
  enable_offload: True

  model:
    model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/pretraining/checkpoint-80000"   # student init
    model_type: "gr00t"
    action_dim: 12
    num_action_chunks: 5
    denoising_steps: 4
    add_value_head: False       # no critic / value head for velocity distillation
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"
    policy_setup: "robocasa_panda_omron"
    rl_head_config:
      joint_logprob: False      # one stochastic denoise step per rollout (Hybrid SDE);
                                # GR00T's train path has no fully deterministic mode
      noise_method: "flow_sde"
      add_value_head: ${..add_value_head}
      # eagle_input_ids are padded to exactly this length, and F.pad with a negative
      # amount TRUNCATES. RoboCasa's three cameras tokenize to 826 for a long task
      # description, so the LIBERO default of 570 silently cut 232 of the 768 image
      # placeholder tokens (GR00T then prints "warning: The size of tensor a (536) must
      # match the size of tensor b (768)" and drops vision tokens).
      padding_value: 1024

  optim:
    lr: 2.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    wrap_policy:
      # GR00T's _no_split_modules lists ValueHead, but velocity distillation trains no
      # critic so that module is never built and the default policy raises "Could not find
      # the transformer layer class to wrap". Name the classes that do exist instead of
      # adding a critic we would not use.
      transformer_layer_cls_to_wrap:
        - Eagle2_5_VLForConditionalGeneration
        - FlowMatchingActionHeadForRLActionPrediction
        - TimestepEncoder
        - TimestepEmbedding
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
