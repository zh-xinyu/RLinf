# Pilot: 200 student updates, 100 physical rounds, T96/B2304/Refresh-R2.
# Adaptive allocation changes new physical experience, not teacher loss shares.
defaults:
  - robocasa365_mopd_refresh_r2_t96_gr00t_full
  - _self_

runner:
  overlap_env_bootstrap: false
  logger:
    project_name: RoboCasa_MultiTeacher_Diagnostics
    wandb_group: adaptive_rollout_pilot
  rollout_allocation:
    enabled: true
    mode: adaptive
    teacher_reference_file: ${oc.env:OPD_TEACHER_REFERENCE,null}
    seed: 0
    warmup_rounds: 20
    window_rounds: 20
    interval_rounds: 10
    min_task_episodes: 5
    rho: 0.5
    epsilon: 0.01
    max_quota_change: 8
    static_quotas:
      atomic_seen: 16
      composite_seen: 40
      composite_unseen: 40

env:
  train:
    task_sampling_strategy: suite_quota

actor:
  global_batch_size: 2304
