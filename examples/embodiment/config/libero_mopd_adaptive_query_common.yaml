# Same tested T64/B512/micro2/LR3e-5 and 100-round recipe.
# Current gap/query controller; keep historical YAMLs intact.
defaults:
  - libero_mopd_formal_t64_common
  - _self_

runner:
  logger:
    experiment_name: libero_gap_query
    wandb_group: ${oc.env:OPD_WANDB_GROUP,T64_gap_query_W10_I10_seed0}
  rollout_allocation:
    rho: 1.0
    epsilon: 0.0
    priority_power: 2.0
    # One physical-round timescale; coverage is a validity check, not a tuned gate.
    warmup_rounds: 10
    window_rounds: 10
    interval_rounds: 10
    min_task_episodes: 1
    max_quota_change: 6

algorithm:
  suite_query_weights: null
  sync_suite_query_weights: false
  suite_loss_weights: null
  sync_suite_loss_weights: false
