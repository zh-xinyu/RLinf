# Set OPD_PI05_STUDENT_CHECKPOINT to a checkpoint with SFT config/norm metadata.
# Set OPD_PI05_TEACHER_CHECKPOINT to the compatible teacher checkpoint.
# Method 3 (M3): Local Flow-SDE Analytic KL, for the Flow-Based OPD Mechanism Study.
# Derived from
# maniskill_veldistill_openpi_pi05.yaml (M1) -- everything except algorithm.loss_type and
# the experiment name is unchanged, per the plan's "keep identical: action normalization,
# action chunk length, flow timestep convention, denoising steps, training budget, rollout
# budget, teacher-query budget" requirement.
#
# Rollout: same deterministic ODE as M1 (noise_method: flow_ode). Do NOT sample an SDE
# transition here -- that's M3-Hybrid's job. This isolates "analytic KL loss" as the only
# change vs M1.
#
# Loss: at the same (o_t, A_t^tau, tau), build p_S = N(mu_S, Sigma_tau) and
# p_T = N(mu_T, Sigma_tau) from student/teacher velocities (Sigma_tau from the flow_sde
# closed-form schedule, shared between student and teacher per the plan), and train with
#   L_M3 = D_KL(p_S || p_T) = 0.5 * (mu_S - mu_T)^T Sigma_tau^-1 (mu_S - mu_T)
#
# The actor dispatches analytic_local_kl through rlinf/algorithms/flow_opd.py.
# Numerical objective checks are in tests/unit_tests/test_flow_opd.py.
defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:OPD_RUN_DIR,./outputs}
    project_name: rlinf_pi_opd
    experiment_name: "maniskill_m3_openpi_pi05"
    logger_backends: ["tensorboard", "wandb"]
    # wandb_entity: null   # optional; default (null) uses your personal wandb entity/team

  max_epochs: 1000
  max_steps: 25   # training-rollout success_once is flat past step ~20-25 in the 50-step runs
                  # (final-10 window mean reached by then, later changes < the window sd),
                  # so the second half bought nothing. Halving the budget pays for per-step eval.
  only_eval: False
  val_check_interval: 1    # the whole gain happens in the first ~10 steps; 5 eval points could not resolve it
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False   # unused (no advantages)
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level      # unused by analytic_local_kl, kept for consistency
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1               # supervised KL; teacher velocities/means are cached

  adv_type: gae                 # placeholder; compute_advantages returns early for this loss_type
  loss_type: analytic_local_kl
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: False           # required so preprocess_embodied_batch builds loss_mask
    ignore_terminations: False  # mask steps after episode termination
    use_fixed_reset_state_ids: False
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    init_params:
      use_multiple_plates: False
  eval:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student
    precision: ${actor.model.precision}

  # Frozen teacher whose velocity/local-Gaussian is distilled into the student.
  expert_model:
    model_path: ${oc.env:OPD_PI05_TEACHER_CHECKPOINT}  # RL-FlowSDE weights + SFT norm/config (composed via symlinks)
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 5120
  seed: 0
  enable_offload: True
  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student
    model_type: "openpi"
    add_value_head: False       # no critic / value head for this mechanism study
    num_action_chunks: 5
    num_steps: 4
    openpi:
      value_after_vlm: True
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      noise_method: "flow_ode"  # deterministic ODE rollout, matches M1 (no SDE sampling yet)
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
    policy_setup: widowx_bridge

  optim:
    lr: 5.0e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
