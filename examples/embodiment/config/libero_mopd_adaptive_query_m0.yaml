# M0: Uniform-R1; 100 physical rounds, save every 25 rounds.
defaults:
  - libero_mopd_adaptive_query_common
  - _self_

runner:
  max_steps: 100
  save_interval: 25
  logger:
    wandb_run_name: ${oc.env:OPD_WANDB_RUN_NAME,M0_Uniform-R1_T64_B512_seed0}
  rollout_allocation:
    mode: uniform
    teacher_reference_file: null

algorithm:
  flow_refresh_updates: 1
  sync_suite_query_weights: false
