# Four-specialist pi0.5 pilot; FP32 actor masters + BF16 AMP.
defaults:
- env/robotwin_four_task_clean@env.train
- env/robotwin_four_task_clean@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/bucket_syncer@weight_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:OPD_RUN_DIR}
    project_name: RoboTwin_MultiTeacher_Pilots
    experiment_name: robotwin4_uniform_r2_pilot
    wandb_group: robotwin4_base_student_pilots
    logger_backends:
    - tensorboard
    - wandb
  max_epochs: 1000
  max_steps: 80
  only_eval: false
  val_check_interval: -1
  save_interval: 20
  resume_dir: null
  ckpt_path: null
  step_unit: optimizer_update
  overlap_env_bootstrap: false
  rollout_allocation:
    enabled: true
    mode: uniform
    teacher_reference_file: ${oc.env:OPD_TEACHER_REFERENCE,null}
    seed: 0
    warmup_rounds: 5
    window_rounds: 5
    interval_rounds: 5
    min_task_episodes: 5
    rho: 0.5
    epsilon: 0.01
    max_quota_change: 8
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: analytic_local_kl
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  flow_refresh_updates: 2
  suite_balanced_sampling: true
  suite_batch_order: grouped
  log_suite_velocity_metrics: true
  sync_suite_loss_weights: false
env:
  group_name: EnvGroup
  train:
    total_num_envs: 64
    rollout_epoch: 1
    task_sampling_strategy: suite_quota
    episode_horizon_source: task_horizon
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 900
    auto_reset: false
    ignore_terminations: false
  eval:
    total_num_envs: 32
    rollout_epoch: 1
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 900
    auto_reset: false
    ignore_terminations: false
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
  expert_models:
    adjust_bottle:
      model_path: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/adjust_bottle
    handover_mic:
      model_path: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/handover_mic
    place_container_plate:
      model_path: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/place_container_plate
    stack_bowls_two:
      model_path: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/stack_bowls_two
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 512
  seed: 0
  enable_offload: true
  model:
    model_path: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_base_torch
    model_type: openpi
    strict_checkpoint_loading: true
    num_action_chunks: 25
    action_dim: 14
    num_steps: 10
    add_value_head: false
    policy_setup: aloha
    openpi:
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      action_horizon: 50
      train_expert_only: false
      nft_joint_forward: true
      noise_method: flow_ode
      noise_level: 0.5
      joint_logprob: true
    openpi_data:
      adapt_to_pi: false
      extra_delta_transform: true
    opd_task_norm_stats:
      adjust_bottle: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/adjust_bottle/assets/robotwin/norm_stats.json
      handover_mic: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/handover_mic/assets/robotwin/norm_stats.json
      place_container_plate: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/place_container_plate/assets/robotwin/norm_stats.json
      stack_bowls_two: ${oc.env:ROBOTWIN_RUNTIME_ROOT}/models/pi05_pace_torch/stack_bowls_two/assets/robotwin/norm_stats.json
    require_fp32_trainable_params: true
  optim:
    lr: 2.5e-05
    value_lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0
    lr_scheduler: constant
    lr_warmup_steps: 8
    weight_decay: 1.0e-05
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: true
      precision: bf16
  cast_trainable_params_to_fp32: true
reward:
  use_reward_model: false
critic:
  use_critic_model: false

# Dense FP32 updates are streamed instead of one full-model sparse COO patch.
# Individual tensors are not split; the largest embedding is about 1.96 GiB.
weight_syncer:
  bucket:
    bucket_size: 134217728
    bucket_dtype: null
    load_instant: true
