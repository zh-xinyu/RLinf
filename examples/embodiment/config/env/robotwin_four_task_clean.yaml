env_type: robotwin
required_runtime_profile: pi05-four-task
total_num_envs: 64
auto_reset: false
ignore_terminations: false
reward_coef: 1.0
use_custom_reward: true
use_rel_reward: true
center_crop: false
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 900
max_episode_steps: 900
is_eval: false
assets_path: ${oc.env:ASSETS_PATH}
enable_offload: true
instruction_type: seen
task_names: [adjust_bottle, handover_mic, place_container_plate, stack_bowls_two]
task_horizons:
  adjust_bottle: 400
  handover_mic: 600
  place_container_plate: 400
  stack_bowls_two: 900
video_cfg:
  save_video: false
  info_on_video: false
  video_base_dir: ${runner.logger.log_path}/video/train
task_config:
  planner_backend: mplib
  render_freq: 0
  episode_num: 50
  use_seed: false
  save_freq: 15
  embodiment: [aloha-agilex]
  language_num: 100
  domain_randomization:
    random_background: false
    cluttered_table: false
    clean_background_rate: 1
    random_head_camera_dis: 0
    random_table_height: 0
    random_light: false
    crazy_random_light_rate: 0
  camera:
    head_camera_type: D435
    wrist_camera_type: D435
    collect_head_camera: true
    collect_wrist_camera: true
  data_type:
    rgb: true
    third_view: false
    depth: false
    pointcloud: false
    observer: false
    endpose: true
    qpos: true
    mesh_segmentation: false
    actor_segmentation: false
  pcd_down_sample_num: 1024
  pcd_crop: true
  save_path: ./outputs/robotwin4/simulator
  clear_cache_freq: 1
  collect_data: true
  eval_video_log: false
