# Routed multi-teacher OPD (MOPD) for GR00T N1.5 on RoboCasa365.
#
# One student is distilled from three task-suite specialists with Method 4 sampled
# flow-transition OPD. The student samples one Hybrid-SDE transition and the routed
# teacher scores that same transition, producing r_OPD = log p_T - log p_S_old.
#
# The student runs the simulator; teachers are frozen and scored once per rollout, one
# teacher on the GPU at a time (the batch is partitioned by suite in the actor).
#
# split: target -- composite_unseen has no "pretrain" datasets (get_ds_soup returns 0
# tasks there), so "target" is the only split under which all three suites resolve.
defaults:
  - env/robocasa365@env.train
  - env/robocasa365@env.eval
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf_mopd_robocasa
    experiment_name: "robocasa365_mopd_gr00t"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 1000
  max_steps: 25
  only_eval: False
  val_check_interval: 5
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False   # unused (no advantages)
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  # M4's reward is per element: r_OPD = l_T - l_S with a diagonal Sigma, which is what
  # makes the score-function estimator unbiased. Both of the chunk_level settings destroy
  # that -- reward_type: chunk_level flattens the advantages and logprob_type: chunk_level
  # sums the log-probs over the chunk, and the loss then compares [1536] against [8].
  # Only the token_level branch of preprocess_loss_inputs keeps them aligned, and it is
  # the only branch that carries an OPD-specific assert. Matches both the working
  # libero_10_opd_openvlaoft.yaml and the mechanism study's maniskill_m4_openpi_pi05.yaml.
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  # The advantage contains behavior-policy log-probs, so reusing a batch would be an
  # uncorrected off-policy update.
  update_epoch: 1

  # Every suite contributes the same number of samples to the update, so each routed
  # teacher gets the same share of the gradient. Without it the share is set by episode
  # length -- RoboCasa's composite horizons are ~3x the atomic ones, so the atomic teacher
  # would carry ~1/8 of the weight instead of 1/3.
  #
  # This also decouples the batch size from the env count: actor.global_batch_size is now
  # the number of samples drawn per update, independent of how many transitions the
  # rollout produced.
  suite_balanced_sampling: True

  # M4: sampled reverse-KL OPD. The teacher scores the transition the student actually
  # sampled, r_OPD = l_T - l_S_old, and that per-element reward is the advantage.
  adv_type: opd
  loss_type: opd
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    # 48 envs x ~1050 mean horizon = ~50,400 env-steps per epoch (~63 s of pure CPU
    # simulation at the measured ~800 env-steps/s).
    #
    # The value is not free to change. Suite-balanced sampling draws its quota per rank, so
    # every rank's envs must cover all three suites. With 8 env workers, `ordered` gives
    # each worker `total_num_envs / 8` consecutive tasks from the 6-task filter: at 48 that
    # is all six (two per suite), at 24 it would be three consecutive tasks and half the
    # workers would hold no atomic_seen and half no composite_unseen.
    #
    # Rule: total_num_envs / num_env_workers must be a multiple of the task count.
    total_num_envs: 48
    split: target
    task_soup: [atomic_seen, composite_seen, composite_unseen]
    task_mode: null             # keep both atomic and composite tasks
    task_filter:                # two shortest-horizon tasks per suite, so a routed
      - TurnOnMicrowave         # pilot fits in CPU-simulated wall clock
      - CloseToasterOvenDoor    # atomic_seen, 450 steps each
      - ScrubCuttingBoard       # composite_seen, 1200
      - RinseSinkBasin          # composite_seen, 1350
      - CuttingToolSelection    # composite_unseen, 1200
      - CategorizeCondiments    # composite_unseen, 1650
    # Deterministic round-robin over the task list, cursor persisting across epochs and
    # offset per worker. `random` draws each env's task i.i.d., which at this scale swings
    # the per-suite mix ~18% epoch to epoch and, at the full 50-task set, leaves 27% of
    # tasks with no env at all. This does not make the run deterministic: which *instance*
    # of a task is rolled out is still random (use_fixed_reset_state_ids is False here).
    task_sampling_strategy: ordered
    auto_reset: False           # required so preprocess_embodied_batch builds loss_mask
    ignore_terminations: False
    # Each task runs its own horizon rather than a shared cap. At the previous 320 steps
    # the student was distilled on the first 19-27% of a composite trajectory and then
    # evaluated on all of it, which removes most of what on-policy distillation is for.
    # The batch size is decoupled from this by algorithm.suite_balanced_sampling below,
    # so a longer episode changes coverage, not the number of gradient samples.
    episode_horizon_source: task_horizon
    # Fallback horizon, and the rollout-epoch length: must cover the longest task in the
    # filter (CategorizeCondiments, 1650) or long episodes get cut. 1664 = 104 x 16, and
    # validate_embodied_cfg requires a multiple of num_action_chunks.
    max_episode_steps: 1664
    max_steps_per_rollout_epoch: 1664
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    init_params:
      camera_heights: 256       # the released checkpoints were trained at 256
      camera_widths: 256
    observation:
      state_layout:             # 16-d, in the order the GR00T checkpoints expect
        - base_pos
        - base_quat
        - base_to_eef_pos
        - base_to_eef_quat
        - gripper_qpos
  eval:
    rollout_epoch: 1
    total_num_envs: 48          # 6 tasks x 8 episodes, and divisible by the 8 workers
    split: target
    task_soup: [atomic_seen, composite_seen, composite_unseen]
    task_mode: null
    task_filter:                # two shortest-horizon tasks per suite, so a routed
      - TurnOnMicrowave         # pilot fits in CPU-simulated wall clock
      - CloseToasterOvenDoor    # atomic_seen, 450 steps each
      - ScrubCuttingBoard       # composite_seen, 1200
      - RinseSinkBasin          # composite_seen, 1350
      - CuttingToolSelection    # composite_unseen, 1200
      - CategorizeCondiments    # composite_unseen, 1650
    task_sampling_strategy: ordered
    auto_reset: True
    ignore_terminations: True
    episode_horizon_source: max_episode_steps
    # Must be a multiple of num_action_chunks (16); validate_embodied_cfg asserts it.
    # 1664 covers every task in the filter above -- the longest is 1650, so a shorter
    # horizon would score the composite tasks as failures regardless of the policy.
    # Note this uses episode_horizon_source: max_episode_steps (one episode per env,
    # tasks weighted equally), which the standalone eval config does not -- the two
    # aggregates are not comparable.
    max_episode_steps: 1664
    max_steps_per_rollout_epoch: 1664
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      camera_heights: 256
      camera_widths: 256
    observation:
      state_layout:
        - base_pos
        - base_quat
        - base_to_eef_pos
        - base_to_eef_quat
        - gripper_qpos

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/pretraining/checkpoint-80000"   # student init
    precision: ${actor.model.precision}
    action_head_precision: bf16

  # Routed teachers. Keys are RoboCasa task-suite (task_soup) labels; the rollout worker
  # turns each sample's suite into an index into this mapping and the actor groups the
  # teacher forward passes by it.
  expert_models:
    atomic_seen:
      model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/target_posttraining/atomic_seen/checkpoint-60000"
      precision: ${actor.model.precision}
      action_head_precision: bf16
    composite_seen:
      model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_seen/checkpoint-60000"
      precision: ${actor.model.precision}
      action_head_precision: bf16
    composite_unseen:
      model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_unseen/checkpoint-60000"
      precision: ${actor.model.precision}
      action_head_precision: bf16

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  # Fixed-size suite-balanced draw; independent of the number of collected transitions.
  global_batch_size: 1280
  seed: 0
  enable_offload: True

  model:
    model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/pretraining/checkpoint-80000"   # student init
    model_type: "gr00t"
    action_dim: 12
    # The official evaluation executes the model's full 16-step action horizon
    # (run_phase2_paired_eval.sh: --n_action_steps 16), which is also
    # len(action_indices) in the data config. Emitting only the first few changes the
    # control regime entirely.
    num_action_chunks: 16
    denoising_steps: 4
    add_value_head: False       # M4 uses raw reverse-KL rewards, no critic
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"
    policy_setup: "robocasa_panda_omron"
    action_head_precision: fp32
    require_fp32_trainable_params: True
    rl_head_config:
      # M4 is defined on a Hybrid-SDE rollout: exactly one denoise step is stochastic and
      # that transition is the one the teacher scores. joint_logprob: False selects it --
      # True would make every step stochastic and score the whole chain instead.
      #
      # noise_level is LIVE for M4, unlike M1 where the rollout is deterministic and the
      # value is inert. 0.5 is inherited from the PPO/GRPO defaults in model/gr00t.yaml;
      # measured train-vs-eval action deviation at that value is 50-90% relative, so it is
      # a real knob and not a formality.
      joint_logprob: False
      noise_method: "flow_sde"
      add_value_head: ${..add_value_head}
      # eagle_input_ids are padded to exactly this length, and F.pad with a negative
      # amount TRUNCATES. RoboCasa's three cameras tokenize to 826 for a long task
      # description, so the LIBERO default of 570 silently cut 232 of the 768 image
      # placeholder tokens (GR00T then prints "warning: The size of tensor a (536) must
      # match the size of tensor b (768)" and drops vision tokens).
      padding_value: 1024

  optim:
    # Keep M4 directly comparable with the M1 pilot. The official offline recipe is only
    # a scale reference for this on-policy objective, and the constant schedule has no
    # dependency on runner.max_steps. A future decaying schedule must declare its own
    # total_training_steps horizon.
    lr: 2.0e-6
    value_lr: 2.0e-6
    adam_beta1: 0.95
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 1.0e-5
    clip_grad: 1.0
    critic_warmup_steps: 0
    lr_scheduler: constant
    lr_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    wrap_policy:
      # GR00T's _no_split_modules lists ValueHead, but velocity distillation trains no
      # critic so that module is never built and the default policy raises "Could not find
      # the transformer layer class to wrap". Name the classes that do exist instead of
      # adding a critic we would not use.
      transformer_layer_cls_to_wrap:
        - Eagle2_5_VLForConditionalGeneration
        - FlowMatchingActionHeadForRLActionPrediction
        - TimestepEncoder
        - TimestepEmbedding
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
      cast_forward_inputs: True

reward:
  use_reward_model: False

critic:
  use_critic_model: False
