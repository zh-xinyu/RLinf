# Standalone evaluation for the routed-MOPD GR00T N1.5 student on RoboCasa365.
#
# Mirrors env.eval of examples/embodiment/config/robocasa365_mopd_gr00t.yaml field for
# field, so a number from here is comparable with the in-training validation.
#
# Baseline (student before distillation): leave runner.ckpt_path null.
# Trained student: runner.ckpt_path=<log_dir>/checkpoints/global_step_N/actor/model_state_dict/full_weights.pt
defaults:
  - env/robocasa365@env.eval
  - model/gr00t@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # "all" resolves to every GPU the node reports, independently of
    # CUDA_VISIBLE_DEVICES or Ray's --num-gpus, so on a shared box it happily creates
    # eight rollout workers and stacks them on whatever is visible. Set
    # MOPD_PLACEMENT=0 (or 0-1, ...) to pin the run to specific hardware ranks.
    env,rollout: ${oc.env:MOPD_PLACEMENT,all}

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf_mopd_robocasa
    experiment_name: "robocasa365_mopd_gr00t_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 48
    seed: 7
    split: target
    task_soup: [atomic_seen, composite_seen, composite_unseen]
    task_mode: null
    task_filter:
      - TurnOnMicrowave
      - CloseToasterOvenDoor
      - ScrubCuttingBoard
      - RinseSinkBasin
      - CuttingToolSelection
      - CategorizeCondiments
    task_sampling_strategy: ordered
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    # The official probe runs each task's own horizon (get_task_horizon). Both numbers
    # must be multiples of actor/rollout num_action_chunks (16), or the runner asserts.
    episode_horizon_source: task_horizon
    max_episode_steps: 1664      # 16 x 104, covers the longest pilot task (1650)
    max_steps_per_rollout_epoch: 1664
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      camera_heights: 256
      camera_widths: 256
    observation:
      state_layout:
        - base_pos
        - base_quat
        - base_to_eef_pos
        - base_to_eef_quat
        - gripper_qpos

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: "gr00t"
    model_path: "/egr/research-actionlab/liyifa11/models/robocasa365/gr00t_n1-5/foundation_model_learning/pretraining/checkpoint-80000"
    precision: "bf16"
    action_dim: 12
    num_action_chunks: 16       # official --n_action_steps 16
    denoising_steps: 4
    add_value_head: False
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"
    policy_setup: "robocasa_panda_omron"
    rl_head_config:
      joint_logprob: False
      noise_method: "flow_sde"
      add_value_head: ${..add_value_head}
      padding_value: 1024
