# Set OPD_PI05_STUDENT_CHECKPOINT to a checkpoint with SFT config/norm metadata.
# Eval config for Method 1 (velocity distillation) checkpoints on ManiSkill (pi0.5).
# Same env.eval + model spec as maniskill_veldistill_openpi_pi05.yaml training config.
# Baseline (SFT): runner.ckpt_path=null.  Trained ckpt: set runner.ckpt_path to
#   <run>/checkpoints/global_step_<N>/actor/model_state_dict/full_weights.pt
# (loaded via load_state_dict onto the SFT-configured model -> norm stats stay from SFT).
defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0_5@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:OPD_RUN_DIR,./outputs}
    project_name: rlinf_pi_opd
    experiment_name: "maniskill_veldistill_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null   # override with .../global_step_N/actor/model_state_dict/full_weights.pt

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 320
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
    init_params:
      use_multiple_plates: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  unnorm_key: libero_10

  model:
    model_path: ${oc.env:OPD_PI05_STUDENT_CHECKPOINT}  # student SFT (base + norm stats)
    model_type: "openpi"
    add_value_head: False
    num_action_chunks: 5
    num_steps: 4
    openpi:
      value_after_vlm: True
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      noise_method: "flow_noise"
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      num_steps: ${rollout.model.num_steps}
    policy_setup: widowx_bridge
